# Render settings shared by every scene. The values match the report figures:
# a white page, dark ink, and one frame size for the whole deck.
[CLI]
media_dir = ./out
video_dir = {media_dir}/mp4
images_dir = {media_dir}/stills
background_color = WHITE
frame_rate = 30
pixel_width = 1920
pixel_height = 1080

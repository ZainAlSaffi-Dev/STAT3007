[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "deeplearning"
authors = [
  { name = "Zac Kienzle", email = "zac.kienzle@gmail.com" },
]
description = "STAT3007 Group G2: what sets the grokking time on modular addition"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "annotated-types>=0.8.0",
  "icontract>=2.7.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.13.5",
  "pyyaml>=6.0.3",
  "scipy>=1.18.0",
]

[project.urls]
Homepage = "https://github.com/ZainAlSaffi-Dev/STAT3007"
"Bug Tracker" = "https://github.com/ZainAlSaffi-Dev/STAT3007/issues"
Discussions = "https://github.com/ZainAlSaffi-Dev/STAT3007/discussions"
Changelog = "https://github.com/ZainAlSaffi-Dev/STAT3007/releases"


[dependency-groups]
test = [
  "hypothesis >=6",
  "pytest >=9",
  "pytest-cov >=7",
  "pytest-env>=1.7.1",
]
dev = [
  { include-group = "test" },
  "deptry>=0.25",
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]
notebooks = [
  { include-group = "analysis" },
  "manim>=0.21.0",
]
grid = [
    "duckdb>=1.5.5",
    "snakemake>=9.27.0",
    "snakemake-executor-plugin-slurm>=2.8.0",
    "torch>=2.13.0",
]
analysis = [
    { include-group = "grid" },
    "lifelines>=0.30.0",
    "matplotlib>=3.11.1",
    "scipy>=1.18.0",
]


[tool.hatch]
version.source = "vcs"
version.raw-options.search_parent_directories = true
build.hooks.vcs.version-file = "src/deeplearning/_version.py"

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"


[tool.uv]
required-environments = [
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
# One version of each package for every Python the lock covers, so a checkout
# trains on the same torch whichever interpreter uv discovers.
fork-strategy = "fewest"

# moderngl 5.12, which manim needs, publishes no cp314 Windows wheel, and
# required-environments needs one for every Python a group is locked for.
[tool.uv.dependency-groups]
notebooks = { requires-python = "<3.14" }


[tool.autoimport.common_statements]
"ge" = "from operator import ge"
"le" = "from operator import le"
"lt" = "from operator import lt"
"max_len" = "from hypothesis.internal.filtering import max_len"
"min_len" = "from hypothesis.internal.filtering import min_len"


[tool.deptry]
non_dev_dependency_groups = ["notebooks", "grid", "analysis"]
extend_exclude = ["noxfile\\.py"]
known_first_party = ["deeplearning"]

[tool.deptry.per_rule_ignores]
DEP002 = ["manim", "snakemake", "snakemake-executor-plugin-slurm"]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--hypothesis-profile=ci"]
strict = true
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:torch.jit._script",
  "ignore::FutureWarning:torch.jit._script",
]
log_level = "INFO"
testpaths = [
  "tests",
]

[tool.pytest_env]
# Tests check the contracts icontract.SLOW marks; runs outside the tests skip them.
ICONTRACT_SLOW = "true"


[tool.mutmut]
# The tests import torch, which mutmut's documentation names as unsafe to fork
# after importing, so each mutant forks from a clean fork server.
process_isolation = "forkserver"


[tool.coverage]
run.source = ["deeplearning"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
python_version = "3.12"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "deeplearning.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.ruff]
builtins = ["snakemake"]
show-fixes = true
force-exclude = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["deeplearning._compat.typing"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "ICN001", "T20", "S101"]
"noxfile.py" = ["D", "T20"]
"docs/conf.py" = ["D"]

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
omit-stars-when-documenting-varargs = true

[tool.doq]
formatter = "google"
